# ============================================================
# Server
# ============================================================
server.port=${PORT:8091}
server.address=${SERVER_ADDRESS:0.0.0.0}

# ============================================================
# SQLite DataSource
# ============================================================
spring.datasource.url=jdbc:sqlite:data/partner-local.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# JWT
# ============================================================
#spring.redis.host=localhost
#spring.redis.port=6379
spring.redis.host=${REDISHOST}
spring.redis.port=${REDISPORT}
spring.redis.username=${REDISUSER}
spring.redis.password=${REDISPASSWORD}
app.jwt.secret=HealthPortalHubPartnerAppSecretKey2024MustBeAtLeast256BitsLong!
app.jwt.expiration-ms=86400000

# ============================================================
# File Storage
# ============================================================
app.upload.dir=uploads

# Multipart (CNIC upload for OCR endpoint)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OCR.space API key — set OCR_SPACE_API_KEY for your own key.
# Fallback `helloworld` keeps OCR working in local dev (limited/demo quota).
app.ocr-space.api-key=${OCR_SPACE_API_KEY:helloworld}
app.ocr-space.url=https://api.ocr.space/parse/image

# Groq Vision — patient prescription scan only (CNIC OCR still uses OCR.space above).
app.groq.api-key=${GROQ_API_KEY}
app.groq.url=https://api.groq.com/openai/v1/chat/completions
app.groq.vision-model=meta-llama/llama-4-scout-17b-16e-instruct

# ============================================================
# Email / SMTP  (override in production via env vars)
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
# Reduced from 45 s → 12 s so async thread pool recycles faster on SMTP failure
spring.mail.properties.mail.smtp.connectiontimeout=12000
spring.mail.properties.mail.smtp.timeout=12000
spring.mail.properties.mail.smtp.writetimeout=12000
# Local dev: set MAIL_CONSOLE_OTP=true to skip SMTP and print OTP in server console.
# Handy when testing on a phone without real email configured.
app.mail.console-otp-instead-of-smtp=${MAIL_CONSOLE_OTP:false}
app.mail.from=${MAIL_FROM:nareshkumar3554572@gmail.com}
app.mail.from-name=Health Wallet Partner

# ============================================================
# Swagger / SpringDoc
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# ============================================================
# Jitsi Meet (virtual consultations)
# Public meet.jit.si shows "waiting for moderator" — configure 8x8 JaaS (free dev tier at jaas.8x8.vc)
# ============================================================
app.jitsi.server-url=${JITSI_SERVER_URL:https://meet.jit.si}
app.jitsi.room-prefix=${JITSI_ROOM_PREFIX:HealthPortalHubAppt}
app.jitsi.jaas-app-id=${JITSI_JAAS_APP_ID:vpaas-magic-cookie-d315eabb12ff4c7e855951f7b571ae6d}
app.jitsi.jaas-kid=${JITSI_JAAS_KID:}
app.jitsi.jaas-private-key-pem=${JITSI_JAAS_PRIVATE_KEY:}
app.jitsi.jaas-private-key-file=${JITSI_JAAS_PRIVATE_KEY_FILE:jaas-keys/jwt.pkcs8.key}
app.jitsi.jaas-kid-file=${JITSI_JAAS_KID_FILE:jaas-keys/kid.txt}

# ============================================================
# OneSignal push (optional — set keys + enabled=true in production)
# External user IDs: DOCTOR:{id}, PHARMACY:{id}, LAB:{id}, PATIENT:{id}, ADMIN:{email}
# ============================================================
app.onesignal.enabled=${ONESIGNAL_ENABLED:true}
app.onesignal.rest-api-key=${ONESIGNAL_REST_API_KEY}
app.onesignal.partner-app-id=${ONESIGNAL_PARTNER_APP_ID:e4580356-2b8d-436c-a29b-03703e9ee0a4}
app.onesignal.patient-app-id=${ONESIGNAL_PATIENT_APP_ID:e4580356-2b8d-436c-a29b-03703e9ee0a4}
app.onesignal.admin-app-id=${ONESIGNAL_ADMIN_APP_ID:}

# ============================================================
# Logging
# ============================================================
logging.level.com.partner.backend=INFO
logging.level.org.springframework.security=WARN

# ============================================================
# Pharmacy inventory expiry (midnight Pakistan time)
# ============================================================
app.inventory.expiry-cron=0 0 0 * * *

